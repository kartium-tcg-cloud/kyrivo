name: TTC in purchases article list
on:
  pull_request:
    paths:
      - 'src/components/achats/AchatsTableau.tsx'
      - 'tests/achats-articles-ttc.test.cjs'
      - '.github/workflows/achats-articles-ttc.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: node --test tests/achats-articles-ttc.test.cjs tests/item-detail-ttc.test.cjs
