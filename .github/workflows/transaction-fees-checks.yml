name: Transaction fees foundation checks

on:
  pull_request:
    paths:
      - "src/types/preferences.ts"
      - "src/lib/preferences.ts"
      - "src/app/preferences/page.tsx"
      - "src/lib/transactionFees.ts"
      - "tests/transaction-fees.test.cjs"
      - ".github/workflows/transaction-fees-checks.yml"

jobs:
  types-and-accounting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: node --test tests/transaction-fees.test.cjs
