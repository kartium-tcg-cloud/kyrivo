name: Trustpilot trial email integration

on:
  pull_request:
    paths:
      - "src/app/api/cron/trial-emails/route.ts"
      - "src/lib/emails/mailer.ts"
      - "src/lib/emails/trustpilot.ts"
      - "tests/trustpilot-trial-invites.test.cjs"
      - ".github/workflows/trustpilot-trial-emails.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Test Trustpilot and email rules
        run: node --test tests/trustpilot-trial-invites.test.cjs
      - name: Type-check
        run: |
          npx next typegen
          npx tsc --noEmit
