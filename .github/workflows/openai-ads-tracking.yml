name: ChatGPT Ads tracking
on:
  pull_request:
    paths:
      - 'src/lib/openaiAds*'
      - 'src/lib/analytics.ts'
      - 'src/components/OpenAIAdsPixel.tsx'
      - 'src/components/MarketingConsentSettings.tsx'
      - 'src/components/marketing/**'
      - 'src/app/admin/marketing/**'
      - 'src/app/abonnements/page.tsx'
      - 'src/app/register/page.tsx'
      - 'src/app/api/stripe/webhook/route.ts'
      - 'src/app/cookies/page.tsx'
      - 'src/app/politique-confidentialite/page.tsx'
      - 'tests/openai-ads-tracking.test.cjs'
      - '.github/workflows/openai-ads-tracking.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: node --test tests/openai-ads-tracking.test.cjs tests/fees-always-on.test.cjs tests/stripe-trial-conversion.test.cjs tests/checkout-eligibility.test.cjs
