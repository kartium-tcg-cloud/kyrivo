name: Billing webhook regression tests

on:
  pull_request:
    paths:
      - "src/app/api/stripe/webhook/route.ts"
      - "tests/stripe-reactivation.test.cjs"
      - ".github/workflows/billing-regression.yml"
  push:
    branches: [main]
    paths:
      - "src/app/api/stripe/webhook/route.ts"
      - "tests/stripe-reactivation.test.cjs"
      - ".github/workflows/billing-regression.yml"

jobs:
  webhook-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Next.js route types
        run: npx next typegen
      - name: TypeScript verification
        run: npx tsc --noEmit
      - name: Run isolated billing webhook tests
        run: node --test tests/stripe-reactivation.test.cjs
